<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fffaf0" />
    <meta
      name="description"
      content="عالم الحروف والأرقام — موقع تعليمي عربي تفاعلي للأطفال لتعلّم الحروف والأرقام والقصص والألعاب."
    />
    <title>عالم الحروف والأرقام</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      body {
        background: #fffaf0;
        color: #334155;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      #root {
        min-height: 100vh;
      }

      .initial-loader {
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
        box-sizing: border-box;
        text-align: center;
      }

      .initial-loader__card {
        max-width: 28rem;
        padding: 2rem;
        border: 1px solid #fde68a;
        border-radius: 1.5rem;
        background: #fff;
        box-shadow: 0 12px 32px rgb(120 53 15 / 8%);
      }

      .initial-loader__icon {
        margin-bottom: 0.75rem;
        font-size: 2.5rem;
      }

      .initial-loader__title {
        margin: 0;
        font-size: 1.25rem;
        font-weight: 800;
      }

      .initial-loader__message {
        margin: 0.5rem 0 0;
        color: #64748b;
      }

      .no-script {
        margin: 1rem;
        padding: 1rem;
        border-radius: 0.75rem;
        background: #fff;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="initial-loader" role="status" aria-live="polite">
        <div class="initial-loader__card">
          <div class="initial-loader__icon" aria-hidden="true">🎈</div>
          <h1 class="initial-loader__title">عالم الحروف والأرقام</h1>
          <p class="initial-loader__message">جارٍ تجهيز الموقع…</p>
        </div>
      </div>
    </div>
    <noscript>
      <p class="no-script" dir="rtl">يرجى تفعيل JavaScript في المتصفح لعرض الموقع التعليمي التفاعلي.</p>
    </noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
